study:
  name: oracle_v0
  asset: BTC
  status: research_only
  label_price: consolidated_median_of_three
  label_index_members:
    - binance_btcusdt_spot_1m
    - kraken_xbtusd_spot_1m
    - coinbase_btcusd_spot_1m

labels:
  source_grid_seconds: 60
  canonical_timestamp: interval_end
  fixed_first_passage:
    threshold_fraction: 0.02
    horizons_seconds: [3600, 14400]
    outcome: competing_first_cause_up_down_none
    same_bar_policy: ambiguous_unscored
    future_gap_policy: censored_gap_unscored
  volatility_normalized:
    status: accepted_d032
    estimator: kappa_times_causal_rv24h
    min_consecutive_returns: 720
    annualized: false
    kappa_rule: 0.02_over_development_median_sigma
    kappa_decimal_places: 6
    common_support_with_fixed: true

sampling:
  risk_clock_seconds: 3600
  risk_clock_phase: utc_hour_end
  precondition_impulse:
    lookback_seconds: 900
    rule: abs_log_close_return_strictly_below
    threshold: log_1.005
    exact_endpoints: true
    missing_policy: exclude_no_imputation
  group_positive_outcomes_by_event_cluster: true
  event_clusters_define_risk_set: false

evaluation:
  status: exp005_complete_null
  split_method: chronological_purged
  boundary_purge_seconds: 14400
  outcome_window_must_remain_in_period: true
  require_multiple_oos_periods: true
  test_reporting_periods: [2025, 2026_01_through_07]
  probability_row_weight: 1
  precision_unit: alert_episode
  recall_lead_unit: direction_horizon_event_cluster
  bootstrap:
    block: utc_week_family_wide
    draws: 1000
    seed: 20250825
    se_ddof: 1
  primary_cells:
    horizons_seconds: [3600, 14400]
    directions: [up, down]
  alert_budget:
    development_quantile: 0.99
    quantile_method: higher
    strict_exceedance: true
  dispositions:
    family_relative_brier_skill_pass: 0.01
    family_relative_brier_skill_fail: -0.01
    precision_multiple_of_cell_base_rate: 2.0
    cluster_recall: 0.10
    median_lead_seconds_1h: 900
    median_lead_seconds_4h: 3600
    minimum_primary_cell_clusters_for_pass: 30
    periods_and_label_families_must_all_pass: true

